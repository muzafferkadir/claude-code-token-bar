name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck

      - name: Install dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install jq shellcheck

      - name: Check shell syntax
        run: bash -n claude-code-token-bar

      - name: Run ShellCheck
        run: shellcheck claude-code-token-bar test/statusline.sh

      - name: Test output
        run: bash test/statusline.sh

      # pwsh is preinstalled on the Linux and macOS runner images, so the two
      # implementations can be diffed against each other here.
      - name: Test bash/pwsh output parity
        run: pwsh -NoProfile -File test/parity.ps1

  powershell:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer reported $($results.Count) issue(s)"
          }
          Write-Host 'PSScriptAnalyzer clean'

      - name: Test output
        shell: pwsh
        run: pwsh -NoProfile -File test/statusline.ps1
